name: TrajVAD-P_msad
description: TrajVAD-P full 27-feature configuration for msad.
version: '1.0'
model:
  model_type: TrajVAD-P
  emb_dim: 3
  num_classes: 80
  hidden_channels: 64
  K: 18
  K_pose: 18
  pose_dim: 51
  lambda_pose: 1.0
  use_emb_in_input: true
  prior_mean: 3.0
  wavenet_dilation: true
  max_dilation: 12
  cont_dim: 27
training:
  batch_size: 256
  num_epochs: 10
  optimizer: rmsprop
  lr: 0.0005
  weight_decay: 1.0e-05
  momentum: 0.9
  grad_clip: 3.0
data:
  feature_selection:
  - cx
  - cy
  - w
  - h
  - vx
  - vy
  - speed
  - ax
  - ay
  - acc
  - area
  - ratio
  - h_norm_speed
  - w_norm_speed
  - area_norm_speed
  - h_norm_acc
  - w_norm_acc
  - area_norm_acc
  - sin_theta
  - cos_theta
  - jerk
  - curvature
  - expansion_rate
  - ar_velocity
  - kinetic_energy
  - path_efficiency
  - conf
  dataset: msad
  feature_variant: seg24_std_nolog
  mode: kf
  seg_len: 24
system:
  seed: 42
  device: cuda
  num_workers: 4
